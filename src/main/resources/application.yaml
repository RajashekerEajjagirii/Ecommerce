spring:
  application:
    name: ecommerce
  batch:
    job:
      # Spring Batch auto-launches jobs at startup by default; keep local/dev startup resilient.
      # Set `BATCH_JOB_ENABLED=true` to enable.
      enabled: true
      allow-start-if-complete: true
    scheduler:
      enabled: true
  cache:
    # Default to local in-memory cache so the app works without Redis.
    # Set `SPRING_CACHE_TYPE=redis` to enable Redis-backed caching.
    type: simple

  mail:
    host: smtp.gmail.com
    port: 587
    # Keep local/dev startup working even when env vars aren't set.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  redis:
    host: localhost
    port: 6379
  data:
    mongodb:
      host: localhost
      port: 27017
      database: ecommerce

  datasource:
    url: "jdbc:mysql://localhost:3306/raj?useSSL=false&serverTimezone=UTC"
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
#  flyway:
#    enabled: true
#    locations: classpath:db/migration

jwt:
  secret: "55324746B788574854549684905683E6383A84390947493083240A7437"
  expiration-ms: 3600000
server:
  port: 8080

logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.cache.interceptor: TRACE

razorpay:
  key_id: "rzp_test_dAKAs7DSepBOrV"
  key_secret: "3i8hADRH1FBawV@Mmc9s6tu4"
#  razorpay.key.secret=3i8hADRH1FBawV@Mmc9s6tu4
# pass it as env variables in edit configuration
stripe:
  secret_key: ${secret_key:}
  public_key: ${public_key:}

payment:
  # Used by @ConditionalOnProperty checks (e.g. StripeConfig). Must have a default.
  provider: ${payment_provider:razorpay}

raj-ecommerce:
  baseUri: ${base_uri:http://localhost:8080}
  accountVerifyUri: /api/auth/verifyAccount/{emailOtp}
  trackDetailsUri: /api/tracking/{trackingNumber}
