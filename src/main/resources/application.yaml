spring:
  application:
    name: ecommerce
  batch:
    job:
      # Disable Spring Boot's default JobLauncherApplicationRunner (it requires a single job name when multiple jobs
      # exist). We provide our own startup runner that launches all local Job beans.
      enabled: false
      allow-start-if-complete: true
    scheduler:
      enabled: true
  cache:
    # Default to local in-memory cache so the app works without Redis.
    # Set `SPRING_CACHE_TYPE=redis` to enable Redis-backed caching.
    type: simple

  mail:
    host: smtp.gmail.com
    port: 587
    # Keep local/dev startup working even when env vars aren't set.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  redis:
    host: localhost
    port: 6379
  data:
    mongodb:
      host: localhost
      port: 27017
      database: ecommerce

  datasource:
    primary:
      jdbc-url: "jdbc:mysql://localhost:3306/raj?useSSL=false&serverTimezone=UTC"
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver

    secondary:
      jdbc-url: jdbc:h2:mem:secondarydb
      username: root
      password: root
      driver-class-name: org.h2.Driver
  # Enable H2 Web Console (Optional but helpful)
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
#  flyway:
#    enabled: true
#    locations: classpath:db/migration

